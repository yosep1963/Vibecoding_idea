[project]
name = "vibe-idea-gen"
version = "0.1.0"
description = "GitHub 레포와 작업 패턴 기반 다음 프로젝트 추천 도구"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "ollama>=0.4.0",
    "sqlalchemy>=2.0.0",
    "umap-learn>=0.5.6",
    "scikit-learn>=1.5.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
vibe = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:src.analyze",
    "ignore::DeprecationWarning:tests.conftest",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
